<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="../script.js" defer></script>
    <link rel="stylesheet" href="../style.css" />
    <title>learning_log</title>
</head>

<body>
        <header>
        <div class="row_header">
            <button onclick="location.href='log.html'" class="bottan">戻る</button>
            <span class="title" >学習記録</span>
        </div>
    </header>

    <input type="button" value="確認" id="click-btn-create" class="bottan2" disabled></input>
    <div class="row">
        <div class=column_create2>
            <div class="colum_create ">
                <div class="smallbox2">学習科目 </div>
                <input type="text" id="category" name="category" class="textBox">
            </div>

            <div class="colum_create ">
                <div class="smallbox2">正答数</div>

                <div class="textrow">
                    <input type="text" id="success" name="success" class="textBox"><span class="text">問</span>
                </div>
            </div>
        </div>
        <div class=column_create2>

            <div class="colum_create ">
                <div class="smallbox2">学習時間</div>
                <div class="textrow">
                    <input type="text" id="learningtime" name="learningtime" class="textBox"><span class="text">分</span>
                </div>
            </div>
            <div class="colum_create ">
                <div class="smallbox2">備考</div>
                <input type="text" id="biko" name="biko" value="" class="textBox">
            </div>
        </div>
    </div>


</body>

</html>
